<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="boxLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Subtle inner glow border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Isometric Package Icon centered -->
  <g transform="translate(106, 106)" filter="url(#dropShadow)">
    <!-- Top Face of Box -->
    <path
      d="M150 20 L270 90 L150 160 L30 90 Z"
      fill="#ffffff"
      fill-opacity="0.95"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Left Face of Box -->
    <path
      d="M30 90 L150 160 L150 280 L30 210 Z"
      fill="#cbd5e1"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Right Face of Box -->
    <path
      d="M150 160 L270 90 L270 210 L150 280 Z"
      fill="#94a3b8"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Center Crease Highlight -->
    <line
      x1="150"
      y1="160"
      x2="150"
      y2="280"
      stroke="#2563eb"
      stroke-width="10"
      stroke-linecap="round"
    />
    <!-- Top Ribbon / Flap Detail -->
    <path
      d="M150 20 L150 160"
      stroke="#2563eb"
      stroke-width="10"
      stroke-linecap="round"
    />
  </g>
</svg>
